<style>
  /* Site theme: html[data-theme] (set by nav.js / JsonDeck.setTheme) wins; else the OS. */
  :root { --page-bg: #f4f4f5; --page-ink: #09090b; --page-soft: #ffffff99; color-scheme: light; }
  :root[data-theme="dark"], :root.dark { --page-bg: #09090b; --page-ink: #fafafa; --page-soft: #ffffff0f; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --page-bg: #09090b; --page-ink: #fafafa; --page-soft: #ffffff0f; color-scheme: dark; } }
  body { margin: 8px; font-family: system-ui, sans-serif; background: var(--page-bg); color: var(--page-ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 0 8px 40px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p.lead { margin: 0 0 16px; font-size: 13px; opacity: .75; }
  .ex { margin: 0 0 20px; }
  /* Theming example: user classes (classNames / cellClass / className) and a CSS-only data-jd override. */
  .ex-row:hover td { background: rgb(37 99 235 / 0.06) !important; }
  .ex-hot { font-weight: 700; text-decoration: underline; text-decoration-color: #dc2626; }
  .ex-brand-card { outline: 2px solid rgb(37 99 235 / 0.25); outline-offset: 2px; }
  #ex-theming [data-jd="card-title"] { color: #2563eb; }
</style>
</head>

<script>const THEME_DOCS = "**Tokens.** Every colour, the radius, the font size and the row height is a CSS variable `--jds-<name>` on `.jd-root` (the full list with defaults is `JsonDeck.THEME_TOKENS`). Set them in config with `theme: { light: {...}, dark: {...} }`, or in your own CSS: `.jd-root { --jds-primary: #2563eb }`.\n\n**Class names.** `classNames` (global, per table or per item) adds your own classes to slots: root, page, section, card, cardTitle, toolbar, table, th, tr, td, groupRow, detailPanel, chart, stat, tabs, badge and more. They are applied as given, so your CSS or your Tailwind works. Plus `className` on any item and `rowClass` / `cellClass(row, column)` on tables.\n\n**Charts.** `palette: [...]` (global or per chart), `colors` per value, and `statusColors` for badges.\n\n**CSS only.** Every slot also carries a stable `data-jd` attribute, e.g. `[data-jd=\"card-title\"]`."</script>

<script>
  JsonDeck.example('#ex-typed', {
    title: 'Typed config with defineConfig',
    description: 'For apps that use jsondeck from npm with TypeScript (code only).',
    code: "// TypeScript: names autocomplete and typos fail to compile.\nimport { defineConfig, mount } from 'jsondeck'\nimport 'jsondeck/jsondeck.css'\n\ntype Finding = { id: string; severity: 'critical' | 'high' | 'medium' | 'low'; cvss: number; status: string }\nconst findings: Finding[] = await fetch('/findings.json').then((r) => r.json())\n\nconst config = defineConfig({ findings }, {\n  tables: {\n    findings: {\n      columnOrder: ['id', 'severity'],          // 'sevrity' would be a type error\n      defaultSort: ['severity', '-cvss'],\n      rowClass: (row) => (row.severity === 'critical' ? 'crit' : undefined),\n      columns: { cvss: { format: 'number:1', sort: (a, b) => a - b } }\n    }\n  }\n})\nmount('#app', config)\n",
    lang: 'ts'
  })
</script>
