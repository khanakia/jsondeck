version: '3'

# Commands for building, checking and releasing jsondeck.
# If Chromium needs extra system libraries on your machine, put
# LD_LIBRARY_PATH=<dir> in .env.local (git-ignored); it is loaded for every task.
dotenv: ['.env.local']

tasks:
  build:
    desc: Build dist/ (the jsondeck.js loader + chunks/, the single offline jsondeck.full.js, jsondeck.mjs + esm/, CSS, types, source maps)
    cmds:
      - pnpm build

  typecheck:
    desc: Strict type check of src and the typed examples
    cmds:
      - pnpm typecheck

  size:
    desc: Raw, gzip and brotli size of every file in dist/
    cmds:
      - node scripts/size.mjs

  analyze:
    desc: Treemap of every chunk of the split build (.analyze/stats.html); then `node scripts/chunk-report.mjs [chunk]` lists what is in each
    cmds:
      - pnpm analyze

  check:merge:
    desc: Prove the class merger (src/lib/merge.ts) matches tailwind-merge on every class in src/
    cmds:
      - node scripts/check-merge.mjs

  build:viz:
    desc: Build the charts demo bundle (dist-viz/) that demo/viz.html and verify-viz.mjs load
    cmds:
      - pnpm build:viz

  verify:
    desc: Every headless suite over http and file://, plus the CDN load check (run build and build:viz first)
    cmds:
      - scripts/verify-all.sh

  release:dry:
    desc: Everything a release does (version, changelog, build, checks, scans) except commit, tag, push and publish
    cmds:
      - node scripts/release.mjs --dry {{.CLI_ARGS}}

  release:
    desc: Release the next version (patch only) to GitHub + jsdelivr; asks before committing
    cmds:
      - node scripts/release.mjs {{.CLI_ARGS}}
