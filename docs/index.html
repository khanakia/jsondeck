<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsondeck docs</title>
<link rel="stylesheet" href="../dist/jsondeck.css">
<style>
  /* Site theme: html[data-theme] (set by nav.js / JsonDeck.setTheme) wins; else the OS. */
  :root { --page-bg: #f4f4f5; --page-ink: #09090b; color-scheme: light; }
  :root[data-theme="dark"], :root.dark { --page-bg: #09090b; --page-ink: #fafafa; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --page-bg: #09090b; --page-ink: #fafafa; color-scheme: dark; } }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--page-bg); color: var(--page-ink); }
  main { max-width: 1320px; margin: 0 auto; padding: 0 8px 48px; }
  /* Sticky sidebar and table of contents sit under the site's own sticky bar. */
  #docs .jd-root { --jds-sticky-top: 48px; }
</style>
</head>

<script src="../demo/nav.js"></script>
<main>
<div id="docs"></div>

lters","level":"page","type":"string[]","default":"","description":"Page-level filter bar: `table.field` or a bare field shared by components."},{"path":"pages[].sections","level":"page","type":"SectionConfig[]","default":"","description":"The page's sections, top to bottom."},{"path":"pages[].sections[].title","level":"page","type":"string","default":"","description":"Section heading."},{"path":"pages[].sections[].description","level":"page","type":"string","default":"","description":"Text under the heading."},{"path":"pages[].sections[].collapsible","level":"page","type":"boolean","default":"","description":"Show a collapse toggle."},{"path":"pages[].sections[].collapsed","level":"page","type":"boolean","default":"","description":"Start collapsed."},{"path":"pages[].sections[].columns","level":"page","type":"number | number[]","default":"","description":"Grid: a column count, or ratios like [2, 1]. Stacks on narrow screens."},{"path":"pages[].sections[].items","level":"page","type":"PageItem[]","default":"","description":"Components placed in this section's grid."},{"path":"pages[].sections[].items[].id","level":"item","type":"string","default":"","description":"Stable id: keys the item's state and saved views; master and targets refer to it (default: page/section/index)."},{"path":"pages[].sections[].items[].title","level":"item","type":"string","default":"","description":"Heading above the component."},{"path":"pages[].sections[].items[].span","level":"item","type":"number","default":"","description":"Grid columns this item spans."},{"path":"pages[].sections[].items[].height","level":"item","type":"number","default":"","description":"Height in px."},{"path":"pages[].sections[].items[].code","level":"item","type":"boolean | string","default":"","description":"Wrap the item in a Preview / Code box: true = its own config as source, a string = that code."},{"path":"pages[].sections[].items[].label","level":"item","type":"string","default":"","description":"Table: tab/title text. Stat: the tile label (default: the item title, else the table label)."},{"path":"pages[].sections[].items[].key","level":"item","type":"string","default":"","description":"Row id column (stable row keys)."},{"path":"pages[].sections[].items[].columns","level":"item","type":"Record\u003cstring, ColumnConfig | string>","default":"","description":"Table: column settings for this placement. KV card: 1 or 2 columns of pairs."},{"path":"pages[].sections[].items[].computed","level":"item","type":"Record\u003cstring, ColumnConfig>","default":"","description":"Computed columns: name → column config with value(row). Same as a `columns` entry whose name is not in the data."},{"path":"pages[].sections[].items[].columnOrder","level":"item","type":"string[]","default":"","description":"Columns listed here come first, the rest follow in data order."},{"path":"pages[].sections[].items[].include","level":"item","type":"string[]","default":"","description":"Only these columns (plus computed ones)."},{"path":"pages[].sections[].items[].exclude","level":"item","type":"string[]","default":"","description":"Columns to leave out. (This placement only.)"},{"path":"pages[].sections[].items[].defaultSort","level":"item","type":"SortConfig[]","default":"","description":"Initial sort: \"col\" (asc), \"-col\" (desc) or { column, direction }. (This placement only.)"},{"path":"pages[].sections[].items[].defaultFilters","level":"item","type":"FilterConfig[]","default":"","description":"Initial filters: { column, operator?, value }. (This placement only.)"},{"path":"pages[].sections[].items[].pageSize","level":"item","type":"number","default":"","description":"Rows per page for this table. (This placement only.)"},{"path":"pages[].sections[].items[].search","level":"item","type":"false | { columns: string[] }","default":"","description":"false = no search box; { columns } = search only these."},{"path":"pages[].sections[].items[].filters","level":"item","type":"false","default":"","description":"false = no filter button."},{"path":"pages[].sections[].items[].views","level":"item","type":"false | ViewsConfig","default":"","description":"Saved views for this table (false = off). (This placement only.)"},{"path":"pages[].sections[].items[].rowClass","level":"item","type":"RowFn\u003cRow, string>","default":"","description":"Extra CSS class for a row, from the row. (This placement only.)"},{"path":"pages[].sections[].items[].onRowClick","level":"item","type":"RowFn\u003cRow, void>","default":"","description":"Called with the row when a row is clicked. (This placement only.)"},{"path":"pages[].sections[].items[].expand","level":"item","type":"false | \"inline\" | \"drawer\" | { relation: string }","default":"\"inline\" when `detail` is set","description":"Row expansion: inline detail panel (chevron column), the drawer, or off. Default: \"inline\" when `detail` is set."},{"path":"pages[].sections[].items[].detail","level":"item","type":"DetailConfig","default":"","description":"What the expanded row shows. Without `fields`: every column hidden in the table."},{"path":"pages[].sections[].items[].groupBy","level":"item","type":"string | string[]","default":"","description":"Group rows by one or more columns (collapsible group rows)."},{"path":"pages[].sections[].items[].groupAggregates","level":"item","type":"Record\u003cstring, GroupAggregate>","default":"","description":"Aggregates shown in each group row, per column."},{"path":"pages[].sections[].items[].quickFilters","level":"item","type":"QuickFilterConfig[]","default":"","description":"One-row filter strip above the table, synced with the filter pills."},{"path":"pages[].sections[].items[].selectable","level":"item","type":"boolean","default":"","description":"Checkbox column + selection bar (copy / clear)."},{"path":"pages[].sections[].items[].density","level":"item","type":"Density","default":"","description":"Row height: compact (28px, default) or comfortable (36px). Overrides the global setting."},{"path":"pages[].sections[].items[].rowActions","level":"item","type":"RowActionConfig[]","default":"","description":"Extra right-click menu items. `rows` = the selected rows (or just this row)."},{"path":"pages[].sections[].items[].component","level":"item","type":"\"table\"","default":"","description":"Component kind: table, chart, stat, kv, markdown or facets."},{"path":"pages[].sections[].items[].table","level":"item","type":"string","default":"","description":"The dataset (a name in tables / data)."},{"path":"pages[].sections[].items[].export","level":"item","type":"boolean","default":"","description":"false hides the CSV/JSON export button (default: shown)."},{"path":"pages[].sections[].items[].facets","level":"item","type":"string[]","default":"","description":"Columns shown in a count-per-value sidebar next to the table."},{"path":"pages[].sections[].items[].master","level":"item","type":"string","default":"","description":"Master–detail: the id of a table item on this page; selecting rows there filters this table to related rows."},{"path":"pages[].sections[].items[].via","level":"item","type":"string","default":"any relation between the tables","description":"Which relation links the two (its label); default: any relation between the tables."},{"path":"pages[].sections[].items[].whenEmpty","level":"item","type":"\"all\" | \"none\"","default":"","description":"With nothing selected in the master: show all rows (default) or none."},{"path":"pages[].sections[].items[].bucket","level":"item","type":"TimeBucket","default":"","description":"Bucket the groupBy values as dates."},{"path":"pages[].sections[].items[].measure","level":"item","type":"Measure","default":"","description":"\"count\" (default), \"sum:col\", \"avg:col\", \"min:col\", \"max:col\", \"distinct:col\" or { op, field }."},{"path":"pages[].sections[].items[].measure.op","level":"item","type":"MeasureOp","default":"","description":"count, sum, avg, min, max or distinct."},{"path":"pages[].sections[].items[].measure.field","level":"item","type":"string","default":"","description":"Column the measure reads."},{"path":"pages[].sections[].items[].where","level":"item","type":"Where","default":"","description":"Only rows matching: { col: value | [values] | { op, value } }."},{"path":"pages[].sections[].items[].where.\u003ckey>","level":"item","type":"WhereClause","default":"","description":"A value (is), an array (is any of) or { op, value, type }."},{"path":"pages[].sections[].items[].where.\u003ckey>.op","level":"item","type":"FilterOperator","default":"","description":"A filter operator (eq, gt, contains, between, …)."},{"path":"pages[].sections[].items[].where.\u003ckey>.value","level":"item","type":"unknown","default":"","description":"Value to compare with."},{"path":"pages[].sections[].items[].where.\u003ckey>.type","level":"item","type":"FilterFieldType","default":"","description":"Comparison type when the guess is wrong (number, date, text)."},{"path":"pages[].sections[].items[].sort","level":"item","type":"SortSpec","default":"","description":"Chart order: \"-value\" (default for categories), \"value\", \"key\", \"-key\" or an explicit value list."},{"path":"pages[].sections[].items[].top","level":"item","type":"number","default":"","description":"Keep the first N keys after sorting and fold the rest into \"Other\". Ignored for time buckets."},{"path":"pages[].sections[].items[].topSeries","level":"item","type":"number","default":"","description":"Same for series."},{"path":"pages[].sections[].items[].fill","level":"item","type":"boolean","default":"true when `bucket` is set","description":"Fill missing time buckets with 0 (default true when `bucket` is set)."},{"path":"pages[].sections[].items[].type","level":"item","type":"ChartType","default":"","description":"Chart type: bar, stacked, grouped, line, area, pie, donut or sparkline."},{"path":"pages[].sections[].items[].horizontal","level":"item","type":"boolean","default":"","description":"bar / stacked / grouped: draw bars left-to-right with labels on the left (best for long labels)."},{"path":"pages[].sections[].items[].colors","level":"item","type":"Record\u003cstring, string>","default":"","description":"Value or series → colour (hex or a token name: s1…s8, good, warning, serious, critical, other)."},{"path":"pages[].sections[].items[].legend","level":"item","type":"boolean","default":"","description":"Hide the legend even with several series."},{"path":"pages[].sections[].items[].series","level":"item","type":"string | RowFn\u003cRow, unknown>","default":"","description":"Chart: second split (stacked/grouped bars, one line per value)."},{"path":"pages[].sections[].items[].targets","level":"item","type":"string[]","default":"","description":"Item ids a click filters (default: tables of the same dataset on the page)."},{"path":"pages[].sections[].items[].compare","level":"item","type":"Where","default":"","description":"Compare against the same measure over rows matching this `where` (e.g. last period)."},{"path":"pages[].sections[].items[].compareLabel","level":"item","type":"string","default":"","description":"Text after the delta, e.g. \"vs last week\"."},{"path":"pages[].sections[].items[].upIsGood","level":"item","type":"boolean","default":"true","description":"Is a rise good (green) or bad (red)? Default true. Set false for counts of problems."},{"path":"pages[].sections[].items[].trend","level":"item","type":"{ field: string; bucket?: TimeBucket; points?: number }","default":"","description":"Trend line: the measure per time bucket of a date field."},{"path":"pages[].sections[].items[].trend.field","level":"item","type":"string","default":"","description":"Date column for the sparkline."},{"path":"pages[].sections[].items[].trend.bucket","level":"item","type":"TimeBucket","default":"","description":"day (default), week, month or year."},{"path":"pages[].sections[].items[].trend.points","level":"item","type":"number","default":"","description":"How bal","type":"boolean","default":"true when `pages` is set","description":"Allow drag-and-drop layout editing (default true when `pages` is set)."},{"path":"themeToggle","level":"global","type":"boolean","default":"false: the page theme is site-wide, see JsonDeck.setTheme","description":"Show a theme toggle in this deck (default false: the page theme is site-wide, see JsonDeck.setTheme)."},{"path":"toolbarLabels","level":"global","type":"boolean","default":"false: icons + tooltips","description":"Show text labels next to the toolbar icons (default false: icons + tooltips)."},{"path":"density","level":"global","type":"Density","default":"","description":"Row height for every table: compact (28px, default) or comfortable (36px)."}]}</script>

  JsonDeck.mount('#docs', {"data":"#docs-data","nav":"sidebar","search":true,"editable":false,"themeToggle":false,"statusColors":{"stable":"green","check":"amber"},"tables":{"features":{"key":"id","columns":{"name":{"label":"Feature","wrap":true,"width":180},"summary":{"wrap":true,"width":340},"config":{"type":"mono","wrap":true,"width":180},"example":{"label":"Example","link":"../demo/examples.html#{example}","width":140},"status":{"type":"badge","width":90},"since":{"width":70},"checkReason":{"hidden":true,"label":"Check note"},"id":{"hidden":true},"category":{"type":"badge","hidden":true}}},"config":{"key":"path","columns":{"path":{"type":"mono","pin":"left","width":260,"wrap":true},"level":{"type":"badge","width":80},"type":{"type":"mono","wrap":true,"width":240},"default":{"width":140,"wrap":true},"description":{"wrap":true,"width":420}}}},"pages":[{"id":"overview","title":"Overview","group":"Start","sections":[{"columns":[4,1],"items":[{"id":"ov-md","component":"markdown","text":"# jsondeck docs\n\njsondeck turns JSON plus a small config into a compact dashboard: tables with search, filters, sort, paging and saved views; charts and stat tiles from the same data; links between tables. One `\u003cscript>` tag, no build step, works from `file://`.\n\n:::tip This site is a jsondeck deck\nEvery page here is jsondeck itself: the sidebar is `nav: \"sidebar\"` with page groups, the search box (⌘K) is `search: true`, and the Features and Config reference pages are ordinary jsondeck tables over JSON files.\n:::\n\n## Where to start\n\n- [Getting started](#/getting-started): the smallest page, the CDN tags and `JsonDeck.mount`.\n- [Columns and types](#/columns-and-types): what is guessed and how to override it.\n- [Features](#/features): every feature with its config key and an example.\n- [Config reference](#/config): every key, its type and default."},{"id":"ov-toc","component":"toc"}]},{"title":"At a glance","columns":3,"items":[{"id":"ov-f","component":"stat","table":"features","label":"Features"},{"id":"ov-s","component":"stat","table":"features","label":"Stable","where":{"status":"stable"}},{"id":"ov-c","component":"stat","table":"config","label":"Config keys"}]},{"columns":[2,1],"items":[{"id":"ov-cat","component":"chart","table":"features","type":"bar","groupBy":"category","horizontal":true,"title":"Features by category","targets":[]},{"id":"ov-lvl","component":"chart","table":"config","type":"donut","groupBy":"level","title":"Config keys by level","targets":[]}]}]},{"id":"getting-started","title":"Getting started","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"getting-started-md","component":"markdown","text":"# Getting started\n\njsondeck turns JSON into a dashboard: tables with search, filters, sort and paging, plus charts and stat tiles. You load one script, point it at your data, and call `JsonDeck.mount`.\n\n:::warning\njsondeck is served from GitHub release tags through jsDelivr; it is not on npm. The URLs below work once v0.1.0 is released; until then, use `dist/jsondeck.js` and `dist/jsondeck.css` from a local build.\n:::\n\n## The smallest page\n\n:::steps\n1. Add the script (it links the stylesheet itself; linking it yourself, as below, lets it start loading sooner).\n2. Put your data in a `\u003cscript type=\"application/json\">` tag (or pass an object).\n3. Call `JsonDeck.mount` with the element and the data.\n:::\n\n```html\n\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/khanakia/jsondeck@v0.1.0/dist/jsondeck.css\">\n  \u003cscript src=\"https://cdn.jsdelivr.net/gh/khanakia/jsondeck@v0.1.0/dist/jsondeck.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003cscript type=\"application/json\" id=\"data\">\n    { \"hosts\": [ { \"ip\": \"10.0.0.1\", \"status\": \"up\", \"last_seen\": \"2026-10-30\" },\n                 { \"ip\": \"10.0.0.2\", \"status\": \"down\", \"last_seen\": \"2026-10-12\" } ] }\n  \u003c/script>\n  \u003cdiv id=\"app\">\u003c/div>\n  \u003cscript>\n    JsonDeck.mount('#app', { data: '#data' })\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n## What zero config gives you\n\nEvery named array in `data` becomes a table, one tab each. Column types are guessed from the values (number, date, datetime, URL, IP, email, boolean, enum, JSON, long text, text), labels are made from the keys, and every table gets search, filters, multi-sort, pagination, saved views and CSV/JSON export.\n\n:::tip\n`data` can be an object of named arrays, a single array (it becomes a table called `rows`), or the selector of a JSON script tag. jsondeck never sends your data anywhere.\n:::\n\n## What loads, and when\n\n`jsondeck.js` is a small loader. It fetches the core (React and the table, about 113 kB gzipped) from next to itself, and every other part only when a page uses it: charts and stat tiles when one is on the page, menus and popovers on the first hover or click, the date calendar when a date filter opens, the row drawer, the layout editor, the code view, site search. A plain table page downloads about 115 kB of JavaScript in total.\n\n`JsonDeck.mount` and `JsonDeck.example` can be called right after the script tag: the call waits for the core and returns its handle at once (`handle.ready` resolves once it has rendered). `setTheme`, `pageTheme`, `defineConfig` and `version` work at once too; the rest of the API (`describe`, `htmlSnippet`, `THEME_TOKENS`, ...) is there after `await JsonDeck.ready`.\n\n:::warning\nPages opened straight from disk (`file://`) cannot use `jsondeck.js`: browsers block the module loading it relies on, and it shows a message saying so. Use `jsondeck.full.js` there, the single file with everything (CSS included) that fetches nothing.\n:::\n\n## Mount returns issues\n\n`mount` returns `{ unmount, issues, ready }`. `issues` lists config problems (an unknown key, a bad value) with a suggestion; the deck also shows them above the tables and still renders everything that is valid. The messages load only when a config has problems, so `issues` fills in a moment after the call: read it after `ready`.\n\n```js\nconst deck = JsonDeck.mount('#app', { data: '#data', tables: { hosts: { pagesize: 10 } } })\nawait deck.ready\nconsole.log(deck.issues) // e.g. a \"did you mean pageSize?\" hint\n```\n\n## Next\n\nAdd column settings ([Columns and types](02-columns-and-types.md)) or lay out several components on a page ([Pages, sections and grid](05-pages-sections-grid.md)).\n"},{"id":"getting-started-toc","component":"toc"}]}]},{"id":"columns-and-types","title":"Columns and types","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"columns-and-types-md","component":"markdown","text":"# Columns and types\n\nColumn settings live under `tables.\u003ctable>.columns.\u003ccolumn>`. Every key is optional; anything you leave out keeps the guessed value.\n\n## Types\n\nTypes are guessed, and you can set one yourself. The built-in types are `text`, `longtext`, `number`, `date`, `datetime`, `url`, `ip`, `email`, `boolean`, `enum`, `json` and `mono`. The aliases `badge` (enum), `object` (json) and `string` (text) also work. A plain string is a shorthand for `{ type }`.\n\n```js\nJsonDeck.mount('#app', {\n  data: '#data',\n  tables: {\n    findings: {\n      key: 'id',\n      columnOrder: ['id', 'severity', 'status', 'title'],\n      columns: {\n        id: { type: 'mono', pin: 'left', link: 'https://tracker.example.test/finding/{id}' },\n        severity: { colors: { critical: 'red', high: 'orange', medium: 'amber', low: '#64748b' } },\n        status: 'badge',\n        detail: { filter: false, tooltip: true, wrap: true }\n      }\n    }\n  }\n})\n```\n\n## Which columns, in which order\n\n- `columnOrder` puts some columns first; the rest follow in data order.\n- `include` keeps only the listed columns; `exclude` drops some.\n- `hidden: true` hides a column; users can show it again from the Columns menu (shortcut C).\n\n## Look and feel\n\n- `label`: header text. The default is the key humanized, with words like ID, IP and URL in capitals (change that list with `acronyms`).\n- `width`, `minWidth`, `pin` (`left` or `right`), `align` (`left`, `center`, `right`), `wrap`, `className`.\n- `tooltip: true` shows the full cell text on hover; a function returns your own text.\n- Enum columns render as badges. `colors` maps a value to a tone (`red`, `orange`, `amber`, `green`, `blue`, `violet`, `cyan`, `pink`, `slate`) or any CSS colour. `order` sets the order values sort and list in.\n- `link` is a URL template filled from the row (`https://x/{id}`), or a function of the row.\n\n## Formats\n\n`format` takes a named format with an optional argument: `number:2`, `currency:EUR`, `percent`, `bytes`, `relative`, `date`, `datetime`, `json`, `upper`, `lower`. A function `(value, row) => string` also works. Add your own names with the global `formats` key.\n\n```js\ncolumns: {\n  cvss: { label: 'CVSS', format: 'number:1' },\n  est_cost: { label: 'Est. cost', format: 'currency:USD' },\n  first_seen: { label: 'First seen', format: 'relative' }\n}\n```\n\n## Computed columns\n\nA column name that is not in the data, plus `value(row)`, makes a new column. `tables.\u003ctable>.computed` does the same as a separate map.\n\n```js\ncolumns: {\n  risk: { label: 'Risk', type: 'number', format: 'number:1',\n          value: (row) => ({ critical: 4, high: 3, medium: 2, low: 1 }[row.severity] * row.cvss) }\n}\n```\n\n## Custom renderers\n\n`render(value, row)` returns text, a DOM node or (with the ES module build) a React element. A DOM node is inserted as is, so you own its safety. `renderers.\u003ctype>` replaces the renderer for every column of a type.\n\n## Your own types\n\nA detector claims a column when its test passes on the sample values; a registered type says how to render, filter, sort, align and size it.\n\n```js\nJsonDeck.mount('#app', {\n  data: '#data',\n  guess: { detectors: [{ type: 'instance-id', test: (values) => values.every((v) => /^i-[0-9a-f]{8,}$/.test(String(v))) }] },\n  types: {\n    'instance-id': {\n      render: (v) => { const el = document.createElement('code'); el.textContent = v; return el },\n      filter: 'text',\n      width: 170\n    }\n  }\n})\n```\n\n:::tip\nThe guesser can be tuned with `guess.enumMaxDistinct`, `guess.enumMaxRatio`, `guess.enumMaxLen`, `guess.longTextLen`, `guess.sampleSize` and `guess.knownOrders` (value sets with a natural order, such as critical…none).\n:::\n"},{"id":"columns-and-types-toc","component":"toc"}]}]},{"id":"filters-and-quick-filters","title":"Filters and quick filters","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"filters-and-quick-filters-md","component":"markdown","text":"# Filters and quick filters\n\nEvery table has a search box and a Filter button. Filters show as pills above the table; each pill can be edited or removed.\n\n## The filter control per column\n\nThe control comes from the column type: text, number, boolean, select, multi-select, date or date-range. You can change it, limit its operators, give fixed options, or turn it off.\n\n```js\ncolumns: {\n  status: { filter: { type: 'select', options: ['open', 'fixed', 'accepted'] } },\n  cvss: { filter: { type: 'number', operators: ['gte', 'lte', 'between'] } },\n  detail: { filter: false }\n}\n```\n\nOperators by control:\n\n| Control | Operators |\n|---|---|\n| text | contains, does not contain, is, is not, starts with, ends with, is empty, is not empty |\n| number | =, ≠, >, ≥, \u003c, ≤, between, is empty, is not empty |\n| boolean | is |\n| select | is, is not, is any of, is none of |\n| multi-select | is any of, is none of |\n| date | on, after, on or after, before, on or before |\n| date-range | between, before, after |\n\nDate filters offer presets: today, yesterday, month to date, quarter to date and year to date.\n\n## Search\n\n`search: false` removes the search box; `search: { columns: [...] }` searches only those columns. A column with `search: false` is skipped by the search.\n\n## Default filters\n\n```js\ntables: { findings: { defaultFilters: [{ column: 'status', value: ['open'] }] } }\n```\n\n## Quick filters\n\nA one-row strip above the table with chips, a min/max range with a slider, a toggle, or a search box. It stays in sync with the filter pills.\n\n```js\ntables: { findings: {\n  quickFilters: [\n    { column: 'severity', kind: 'chips' },\n    { column: 'cvss', kind: 'range' },\n    { column: 'exploitable', kind: 'toggle', label: 'Exploitable only' }\n  ]\n} }\n```\n\n## Page filters and click-to-filter\n\nOn a page, `filters: ['area']` adds a filter bar that applies to every component with that field. Clicking a bar or slice in a chart filters the tables of the same dataset on the page (set `targets` to pick other item ids).\n\n```js\npages: [{ title: 'Filter', filters: ['area'], sections: [{ columns: [1, 2], items: [\n  { id: 'by-sev', component: 'chart', table: 'findings', type: 'bar', groupBy: 'severity', horizontal: true },\n  { id: 'list', component: 'table', table: 'findings', include: ['id', 'severity', 'area', 'title'] }\n] }] }]\n```\n\n:::tip\nPress `/` to focus the search and `F` to open the filter picker. `Esc` clears the search.\n:::\n"},{"id":"filters-and-quick-filters-toc","component":"toc"}]}]},{"id":"sorting-grouping-views","title":"Sorting, grouping and views","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"sorting-grouping-views-md","component":"markdown","text":"# Sorting, grouping and views\n\n## Sorting\n\nEach header's menu sorts ascending or descending, and the Sort menu (shortcut S) stacks several rules. Set the starting order with `defaultSort`: `\"col\"` is ascending, `\"-col\"` descending, or `{ column, direction }`.\n\n```js\ntables: { findings: { defaultSort: ['severity', '-cvss'] } }\n```\n\nEnum columns sort by their `order` (severity and p0–p4 orders are known). `sort: false` makes a column unsortable, and `sort: (a, b) => number` compares raw values your way.\n\n## Grouping\n\n`groupBy` groups rows into collapsible group rows, by one column or several. `groupAggregates` shows a subtotal per column in each group row: `count`, `sum`, `avg`, `min` or `max`. Users can change the grouping from the Group by button.\n\n```js\ntables: { findings: {\n  groupBy: 'severity',\n  groupAggregates: { est_cost: 'sum', cvss: 'avg' },\n  columns: { est_cost: { format: 'currency:USD' }, cvss: { format: 'number:1' } }\n} }\n```\n\n## Saved views\n\nA view stores the current filters, sort and columns under a name. Save one from the views menu (shortcut V); views can be favorited, pinned, set as default, updated and deleted. They are stored in this browser (localStorage).\n\n```js\nJsonDeck.mount('#app', { data: '#data', views: {} })        // on (the default)\nJsonDeck.mount('#app', { data: '#data', views: false })     // off everywhere\nJsonDeck.mount('#app', { data: '#data', tables: { logs: { views: false } } }) // off for one table\n```\n\n:::tip\n`views.storage` plugs in your own store. It must implement list, get, save, delete, setDefault and setFavorite; jsondeck's default is the localStorage one.\n:::\n"},{"id":"sorting-grouping-views-toc","component":"toc"}]}]},{"id":"pages-sections-grid","title":"Pages, sections and the grid","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"pages-sections-grid-md","component":"markdown","text":"# Pages, sections and the grid\n\nWithout `pages`, jsondeck shows one tab per table. With `pages`, you decide what goes where: each page has sections, each section has a grid of items (tables, charts, stat tiles, key-value cards, markdown, facets).\n\n```html\n\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/khanakia/jsondeck@v0.1.0/dist/jsondeck.css\">\n  \u003cscript src=\"https://cdn.jsdelivr.net/gh/khanakia/jsondeck@v0.1.0/dist/jsondeck.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003cscript type=\"application/json\" id=\"data\">{ \"findings\": [ { \"id\": \"F-1\", \"severity\": \"high\", \"status\": \"open\" } ] }\u003c/script>\n  \u003cdiv id=\"app\">\u003c/div>\n  \u003cscript>\n    JsonDeck.mount('#app', {\n      data: '#data',\n      pages: [\n        { id: 'overview', title: 'Overview', sections: [\n          { title: 'Summary', columns: [2, 1], items: [\n            { component: 'chart', table: 'findings', type: 'bar', groupBy: 'status', height: 180 },\n            { component: 'stat', table: 'findings', label: 'Findings' }\n          ] },\n          { title: 'About', collapsible: true, items: [\n            { component: 'markdown', text: 'Sections can be **collapsible**, nested, or shown as tabs.' }\n          ] }\n        ] },\n        { id: 'details', title: 'Details', sections: [ { items: [ { component: 'table', table: 'findings' } ] } ] }\n      ]\n    })\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n## Pages\n\n- `title` is the nav label; `id` is the URL hash (`#/overview`), made from the title when left out.\n- `nav: 'sidebar'` shows pages in a sidebar instead of tabs.\n- `filters` adds a page filter bar (see [Filters](03-filters-and-quick-filters.md)).\n\n## Sections\n\n`title`, `description`, `collapsible`, `collapsed`, nested `sections`, and `tabs: true` to show child sections as tabs.\n\n## The grid\n\n`columns` is a count (`3`) or ratios (`[2, 1]`). The grid stacks on narrow screens. Each item can set `span` (grid columns) and `height`.\n\n## Items\n\nEvery item has `component` and (except markdown) `table`, the dataset name. Optional for all: `id` (keys its state and saved views; master and targets refer to it), `title`, `span`, `height` and `code`.\n\nA placed table takes any table setting (columns, include, pageSize, groupBy, …) just for that spot, plus `export`, `facets`, `master`, `via` and `whenEmpty`.\n\n:::tip\n`code: true` wraps an item in a Preview / Code box that shows its config. For a whole deck, `JsonDeck.example(el, { title, description, config })` does the same and generates a complete HTML page in the Code tab.\n:::\n\n## Editing the layout\n\nWith `pages` set, the layout is editable by default (`editable: false` turns it off). Press Edit layout to drag items, make them wider, narrower, taller or shorter, add or remove items, or reset; then Copy config puts the new `pages` on your clipboard.\n"},{"id":"pages-sections-grid-toc","component":"toc"}]}]},{"id":"charts-and-widgets","title":"Charts and widgets","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"charts-and-widgets-md","component":"markdown","text":"# Charts and widgets\n\nCharts, stat tiles and key-value cards are page items that read a dataset by name. They are drawn as plain SVG (no chart library), work in light and dark, and use a colour-blind-safe palette.\n\n## Charts\n\n`type` is `bar`, `stacked`, `grouped`, `line`, `area`, `pie`, `donut` or `sparkline`.\n\n```js\nitems: [\n  { component: 'chart', table: 'findings', type: 'bar', groupBy: 'severity', title: 'By severity' },\n  { component: 'chart', table: 'findings', type: 'stacked', groupBy: 'area', series: 'status' },\n  { component: 'chart', table: 'findings', type: 'line', groupBy: 'first_seen', bucket: 'month' },\n  { component: 'chart', table: 'ec2', type: 'donut', groupBy: 'state' }\n]\n```\n\n- `groupBy`: the category axis (a column, or a function of the row). `bucket` (`day`, `week`, `month`, `year`) turns a date column into time buckets; missing buckets show as zero.\n- `series`: a second split, for stacked or grouped bars and one line per value.\n- `measure`: `count` (default), `sum:col`, `avg:col`, `min:col`, `max:col`, `distinct:col`, or `{ op, field }`.\n- `where`: only rows that match, e.g. `{ status: 'open' }`, `{ severity: ['critical', 'high'] }` or `{ cvss: { op: 'gte', value: 7 } }`.\n- `horizontal: true` draws bars left to right, which suits long labels.\n- `top` keeps the first N values and folds the rest into Other; `topSeries` does the same for series.\n- `sort`: `-value` (default for categories), `value`, `key`, `-key`, or a list of values in order.\n- `colors` sets a colour per value (hex or a token name such as `s3` or `critical`); `legend: false` hides the legend.\n\n:::tip\nValues like critical, high, medium and low get the status colours automatically, and severity order is used for sorting. Clicking a bar or slice filters the tables of the same dataset on the page.\n:::\n\n## Stat tiles\n\n```js\n{ component: 'stat', table: 'findings', label: 'Open findings', where: { status: 'open' },\n  compare: { status: 'fixed' }, compareLabel: 'vs fixed', upIsGood: false,\n  trend: { field: 'first_seen', bucket: 'month' } }\n```\n\n`compare` shows the change against a second `where`; `upIsGood` decides whether a rise is green or red. `trend` adds a sparkline. `hint` adds a line of text under the value.\n\n## Key-value cards\n\nA card shows one row as label/value pairs (pick it with `key`, matched against the table's key column; without `key` it shows the first row), plus any aggregates over the table. Use `fields: []` for a card with aggregates only.\n\n```js\n{ component: 'kv', table: 'ec2', key: 'i-0abc123', fields: ['name', 'state', 'region'] }\n{ component: 'kv', table: 'findings', fields: [], aggregates: [\n    { label: 'Total', measure: 'count' },\n    { label: 'Average CVSS', measure: 'avg:cvss' } ] }\n```\n\n## Markdown\n\n```js\n{ component: 'markdown', text: '## Notes\\nThis page is **fake data**.' }\n```\n\nHeadings, bold, italic, code, links, lists, quotes, fenced code and simple tables are supported. Raw HTML is shown as text, and only http, https, mailto, `#` and relative links are kept.\n\n## Facets\n\nA facets item lists the count per value of some columns; clicking a value filters `targets` (default: the tables of the same dataset on the page).\n\n```js\n{ component: 'facets', table: 'findings', fields: ['severity', 'area', 'status'] }\n```\n"},{"id":"charts-and-widgets-toc","component":"toc"}]}]},{"id":"relations-master-detail-drilldown","title":"Relations, master–detail and drill-down","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"relations-master-detail-drilldown-md","component":"markdown","text":"# Relations, master–detail and drill-down\n\n## Relations\n\nA relation says that a value in one table points at a row in another. Cells holding such a value become links, and the row drawer shows related rows in both directions. Arrays work on either side (many-to-many).\n\n```js\nJsonDeck.mount('#app', {\n  data: '#data',\n  relations: [{ from: 'findings.instance_id', to: 'ec2.instance_id', label: 'Instance', reverseLabel: 'Findings' }],\n  tables: { ec2: { key: 'instance_id' } }\n})\n```\n\n:::steps\n1. `from` is `table.column` holding the pointer.\n2. `to` is `table.column` being pointed at, usually the target table's `key`.\n3. `label` names the forward link and `reverseLabel` the way back.\n:::\n\n## The row drawer\n\nClicking a row opens a drawer with every field of the row and its related rows.\n\n## Expandable rows\n\nSet `detail` and rows get a chevron (or press Enter on a row) that opens an inline detail panel. Without `fields`, the panel shows the columns hidden in the table.\n\n```js\ntables: { findings: {\n  columns: { detail: { hidden: true }, fix_idea: { hidden: true } },\n  detail: { columns: 3 }\n} }\n```\n\n`expand` picks how a row opens: `'inline'` (the default when `detail` is set), `'drawer'`, `false`, or `{ relation }` to expand straight into the rows of one relation. `detail.render` draws the whole panel yourself.\n\n## Nested drill-down\n\n`detail.related: true` shows related rows as nested tables, which expand again (depth-limited).\n\n```js\ntables: { ec2: { key: 'instance_id', detail: { related: true, fields: [] } } }\n```\n\n## Master–detail\n\nOn a page, a table with `master` filters itself to the rows related to what is selected in another table item. A chip shows the filter and clears it.\n\n```js\npages: [{ title: 'Master', sections: [{ columns: 2, items: [\n  { id: 'hosts', component: 'table', table: 'ec2' },\n  { id: 'issues', component: 'table', table: 'findings', master: 'hosts' }\n] }] }]\n```\n\n`via` names the relation to use (its label) when there is more than one; `whenEmpty: 'none'` shows no rows until something is selected (default: all rows).\n"},{"id":"relations-master-detail-drilldown-toc","component":"toc"}]}]},{"id":"selection-and-copy","title":"Selection and copy","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"selection-and-copy-md","component":"markdown","text":"# Selection and copy\n\n## Selecting rows\n\n`selectable: true` adds a checkbox column and a selection bar. Shift-click selects a range.\n\n```js\ntables: { findings: { selectable: true } }\n```\n\n## Copying\n\nSelected rows can be copied as:\n\n- JSON (raw values),\n- CSV,\n- TSV, which pastes cleanly into Google Sheets and Excel,\n- a Markdown table,\n- key: value text, one block per row.\n\nA toast confirms the copy, or says it failed. Copying works on pages opened from disk too: when the browser refuses the clipboard API, jsondeck falls back to the older copy command.\n\n## The right-click menu\n\nRight-click a row or cell for more actions. The menu works with the keyboard: arrows, Enter, Esc, ← and → for submenus, and typing a letter jumps to an item.\n\n## Your own actions\n\n`rowActions` adds items to the right-click menu. `onSelect` gets the clicked row and the selected rows (or just that row).\n\n```js\ntables: { findings: {\n  selectable: true,\n  rowActions: [{ label: 'Alert the ids', onSelect: (row, rows) => alert(rows.map((r) => r.id).join(', ')) }]\n} }\n```\n\n:::tip\nFor downloads instead of the clipboard, use the export menu in the toolbar (current page or all matching rows as CSV, all matching rows as JSON).\n:::\n"},{"id":"selection-and-copy-toc","component":"toc"}]}]},{"id":"theming-and-classes","title":"Theming and classes","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"theming-and-classes-md","component":"markdown","text":"# Theming and classes\n\n## Light and dark\n\nEvery deck follows the page theme: `\u003chtml data-theme=\"dark\">` (or `class=\"dark\"`), otherwise the OS setting. `JsonDeck.setTheme('light' | 'dark' | 'auto')` switches every deck on the page and remembers the choice; `JsonDeck.pageTheme()` reads the current one.\n\n```js\nJsonDeck.setTheme('dark')\nJsonDeck.mount('#app', { data: '#data', themeToggle: true })\n```\n\n- `theme` on one deck: `inherit` (default, follows the page), `auto` (follows the OS), `light` or `dark` (pinned).\n- `themeToggle: true` shows a light/dark switch in that deck.\n\n## Density and toolbar\n\n`density: 'comfortable'` makes rows 36px instead of 28px (globally or per table). `toolbarLabels: true` shows text next to the toolbar icons.\n\n## Your own classes\n\n- `tables.\u003ctable>.rowClass(row)` adds a class to a row.\n- `tables.\u003ctable>.columns.\u003ccolumn>.className` adds a class to a column's cells.\n\n```js\ntables: { findings: {\n  rowClass: (row) => (row.severity === 'critical' ? 'is-critical' : undefined),\n  columns: { title: { className: 'wide-title' } }\n} }\n```\n\n:::warning\njsondeck's own utility classes are prefixed and marked important, so a plain host rule like `.is-critical td { padding: 20px }` may not win against them. Style colours and backgrounds rather than layout, or use a more specific selector.\n:::\n\n## UI text\n\n`labels` replaces any UI string, for translation or wording. Templates use `{from}`, `{to}`, `{total}`, `{n}`, `{shown}` and `{table}`.\n\n```js\nlabels: { search: 'Rechercher dans {table}…', range: '{from}–{to} sur {total}', noResults: 'Aucun résultat' }\n```\n\n## Colour tokens\n\nColours, radius, font size and row heights are CSS variables on `.jd-root`, named `--jds-\u003ctoken>`; `JsonDeck.THEME_TOKENS` lists every token with its light and dark default. Set them per mode in config, or override them in your stylesheet:\n\n```js\ntheme: { mode: 'inherit', light: { primary: '#2563eb', card: '#fffbf5', radius: '10px' }, dark: { primary: '#60a5fa' } }\n```\n\n```css\n.jd-root { --jds-primary: #2563eb; }\n.jd-root.jd-dark { --jds-primary: #60a5fa; }\n```\n\nMain tokens: `page`, `card`, `card-border`, `card-shadow` (none by default), `border` (inner dividers), `foreground`, `muted-foreground`, `primary`, `chart-1` to `chart-8`, `good`, `warning`, `serious`, `critical`, `radius`, `font-size`, `row-height` and `sticky-top`.\n\n:::tip\n`classNames` adds your classes to named parts (root, card, table, tr, td, badge, …) globally, per table or per item; `cellClass(row, column)` styles single cells; stable `data-jd` attributes such as `[data-jd=\"card-title\"]` let plain CSS target any part. `palette` and `statusColors` set chart and badge colours.\n:::\n"},{"id":"theming-and-classes-toc","component":"toc"}]}]},{"id":"typescript-defineConfig","title":"TypeScript and defineConfig","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"typescript-defineConfig-md","component":"markdown","text":"# TypeScript and defineConfig\n\nThe ES module build ships type definitions for every config type. `defineConfig(data, config)` checks table names against your data and column names against each table's row type, and gives row callbacks the real row type.\n\n:::warning\njsondeck is not on npm. Import the ES module from its CDN URL (`https://cdn.jsdelivr.net/gh/khanakia/jsondeck@v0.1.0/dist/jsondeck.mjs`) or a local copy of `dist/`, and point TypeScript at `dist/types/`. The bare `jsondeck` import below assumes a path alias or import map that maps it there.\n:::\n\n```ts\nimport { defineConfig, mount } from 'jsondeck'\nimport 'jsondeck/jsondeck.css'\n\ntype Finding = { id: string; severity: 'critical' | 'high' | 'medium' | 'low'; cvss: number; status: string }\nconst findings: Finding[] = await fetch('/findings.json').then((r) => r.json())\n\nconst config = defineConfig({ findings }, {\n  tables: {\n    findings: {\n      columnOrder: ['id', 'severity'],          // 'sevrity' would be a type error\n      defaultSort: ['severity', '-cvss'],\n      rowClass: (row) => (row.severity === 'critical' ? 'crit' : undefined),\n      columns: { cvss: { format: 'number:1', sort: (a, b) => a - b } }\n    }\n  }\n})\nmount('#app', config)\n```\n\n## What is checked\n\n- Table names in `tables`, and the `table` of every page item.\n- Column names in `columns`, `columnOrder`, `include`, `exclude`, `defaultSort`, `defaultFilters` and `search.columns`.\n- `row` in `rowClass`, `onRowClick`, `value`, `render`, `link`, `tooltip` and `format` has your row type.\n\n:::tip\nFor a typed computed column, add the field to the rows before passing them in (`findings.map((f) => ({ ...f, risk: f.cvss * 2 }))`) so it is part of the row type. Row types declared as `type` aliases work as they are; an `interface` needs an index signature.\n:::\n\n## Types you can import\n\nEvery config type is exported, among them `JsonDeckConfig`, `TableConfig`, `ColumnConfig`, `PageConfig`, `SectionConfig`, `PageItem`, `RelationConfig`, plus `Config`, `RowOf`, `ColumnName` and `ColumnRef` for typed configs.\n\n## describe()\n\n`JsonDeck.describe(data, config)` returns the fully resolved config as plain JSON, in the same shape as the input: copy it, change only what is wrong, and pass it back.\n"},{"id":"typescript-defineConfig-toc","component":"toc"}]}]},{"id":"keyboard-and-accessibility","title":"Keyboard and accessibility","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"keyboard-and-accessibility-md","component":"markdown","text":"# Keyboard and accessibility\n\n## Table shortcuts\n\nShortcuts work when focus is not in a text field and no modifier key is held.\n\n| Key | Action |\n|---|---|\n| `/` | Focus the search box |\n| `F` | Open the filter picker |\n| `S` | Open the sort menu |\n| `V` | Open the views menu |\n| `C` | Open the columns menu |\n| `←` / `→` | Previous / next page |\n| `Esc` | Clear the search |\n| `?` | Show the shortcuts help |\n\nEnter on a row expands it when the table has a detail panel.\n\n## Menus\n\nThe right-click menu uses ↑ and ↓, Home and End, Enter or Space to pick, → and ← to open and close submenus, Esc to close, and typing a letter jumps to an item. While it is open, the table shortcuts above are paused. The toolbar menus support the arrow keys, Enter and Esc.\n\n## Charts\n\nEach chart has `role=\"img\"` with a label describing it, and a hidden data table with the same numbers for screen readers. When a chart filters other items, its bars and slices can be focused and picked with Enter.\n\n## Colour\n\nThe chart palette was checked for colour-blind separation in light and dark mode, and status colours (critical, high, …) always come with a text label or legend, never colour alone.\n\n## Announcements\n\nCopy confirmations are shown in a toast that screen readers announce politely.\n"},{"id":"keyboard-and-accessibility-toc","component":"toc"}]}]},{"id":"embedding-on-your-site","title":"Embedding on your site","group":"Guides","sections":[{"columns":[4,1],"items":[{"id":"embedding-on-your-site-md","component":"markdown","text":"# Embedding on your site\n\n## Your CSS and jsondeck's do not clash\n\njsondeck's classes are prefixed, its reset applies only inside the deck, and its utilities are marked important. A host rule such as `table td { padding: 20px }` or `button { background: hotpink }` does not reach the deck, and jsondeck's styles do not leak into your page.\n\n## Works from disk\n\nA page with its data embedded works opened straight from disk (`file://`) with `jsondeck.full.js`, the single file: everything is inside it (CSS included), so it fetches nothing and makes no network calls. Data never leaves the page. The split `jsondeck.js` needs http(s), because browsers block module loading from `file://`; opened from disk it shows a message pointing at `jsondeck.full.js`.\n\n```html\n\u003cscript type=\"application/json\" id=\"data\">{ \"servers\": [ { \"name\": \"web-1\", \"state\": \"running\" } ] }\u003c/script>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cscript src=\"jsondeck.full.js\">\u003c/script>\n\u003cscript>JsonDeck.mount('#app', { data: '#data' })\u003c/script>\n```\n\n:::tip\nEscape `\u003c` in embedded JSON (`\u003c`) so a value containing `\u003c/script>` cannot end the tag early.\n:::\n\n## Theme sync\n\nDecks follow your site's theme: set `data-theme=\"dark\"` (or `class=\"dark\"`) on `\u003chtml>` and every deck switches, because jsondeck watches that attribute. If your site has its own toggle, keep it as the one switch and leave `themeToggle` off; or call `JsonDeck.setTheme('dark' | 'light' | 'auto')`, which writes the attribute and remembers the choice in localStorage (`jsondeck:theme`).\n\n## Several decks on one page\n\nCall `mount` once per element. Each deck keeps its own state; give placed items an `id` so their saved views stay apart.\n\n```js\nconst a = JsonDeck.mount('#inventory', { data: '#inventory-data' })\nconst b = JsonDeck.mount('#audit', { data: '#audit-data' })\n// later\na.unmount()\n```\n\n## Overlays\n\nMenus, tooltips, dialogs and toasts render above everything else on the page (z-index 2147483000 and up), so they are not cut off by your containers.\n"},{"id":"embedding-on-your-site-toc","component":"toc"}]}]},{"id":"features","title":"Features","group":"Reference","sections":[{"items":[{"id":"features-table","component":"table","table":"features","groupBy":"category","pageSize":200,"detail":{"fields":["checkReason","id"],"columns":2},"quickFilters":[{"column":"status","kind":"chips"},{"column":"category","kind":"chips"}]}]}]},{"id":"config","title":"Config reference","group":"Reference","sections":[{"items":[{"id":"config-table","component":"table","table":"config","pageSize":50,"quickFilters":[{"column":"level","kind":"chips"}]}]}]}]})
