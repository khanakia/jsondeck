# Release jsondeck: runs scripts/release.mjs, which bumps the patch version, builds,
# runs every check, tags a commit that carries dist/, pushes it and creates the
# GitHub release. jsdelivr then serves the files from the tag.
#
# MANUAL ONLY: Actions minutes on this account are metered, so there is no push or
# tag trigger, and the local `task release` is the usual path. To run it:
# GitHub -> Actions -> "Release" -> Run workflow (or: gh workflow run release.yml -R khanakia/jsondeck).
#
# Needs the repository secret RELEASE_DENYLIST (the internal-info patterns, one regex
# per line); without it the script refuses to release.
#
# To make it automatic later, when the Actions budget allows, add under `on:`:
#   push:
#     branches: [main]
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node scripts/release.mjs --yes
        env:
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
          GH_TOKEN: ${{ github.token }}
